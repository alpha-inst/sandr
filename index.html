<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chargement...</title>

    <!-- 1. Balises pour forcer X (Twitter) à afficher l'aperçu de l'image -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Cliquez pour continuer">
    <meta name="twitter:description" content="Une prévisualisation de votre contenu.">
    <meta name="twitter:image" content="https://githubusercontent.com">

    <!-- Balises Open Graph complémentaires (générales) -->
    <meta property="og:title" content="Cliquez pour continuer">
    <meta property="og:image" content="https://githubusercontent.com">
    <meta property="og:type" content="website">

    <!-- 2. Efface le Referrer de X pour que l'origine devienne anonyme (Direct) -->
    <meta name="referrer" content="no-referrer">

    <!-- 3. Redirection de secours si le JavaScript est bloqué, intégrant la fausse source Instagram -->
    <meta http-equiv="refresh" content="1;url=https://getmysocial.com">

    <style>
        body { margin: 0; background-color: #000; display: flex; justify-content: center; align-items: center; height: 100vh; }
        img { max-width: 100%; max-height: 100vh; object-fit: contain; }
    </style>
</head>
<body>

    <!-- L'image s'affiche brièvement sur l'écran pendant le chargement -->
    <img src="https://githubusercontent.com" alt="Loading">

    <script>
        // Redirection ultra-rapide via JavaScript avec marquage Instagram
        window.location.replace("https://getmysocial.com");
    </script>
</body>
</html>
