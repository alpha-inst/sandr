<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Madis 🌸 - Profil</title>

    <!-- Balises d'aperçu de l'image pour X (Twitter) -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Madis 🌸">
    <meta name="twitter:description" content="prob in my bed lol - Accéder au profil complet">
    <meta name="twitter:image" content="https://githubusercontent.com">

    <meta property="og:title" content="Madis 🌸">
    <meta property="og:image" content="https://githubusercontent.com">
    <meta property="og:type" content="website">

    <!-- Masque la provenance X.com -->
    <meta name="referrer" content="no-referrer">

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0b0b;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #ffffff;
            overflow: hidden;
        }

        .wrapper {
            text-align: center;
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
            cursor: pointer;
        }

        img {
            max-width: 95%;
            max-height: 65vh;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            object-fit: contain;
            margin-bottom: 20px;
        }

        .btn-access {
            display: inline-block;
            background: linear-gradient(45deg, #d32f2f, #7b1fa2);
            color: #ffffff;
            text-decoration: none;
            padding: 16px 45px;
            font-size: 19px;
            font-weight: bold;
            border-radius: 50px;
            border: none;
            box-shadow: 0 6px 20px rgba(123, 31, 162, 0.4);
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Le conteneur entier déclenche l'action au clic -->
    <div class="wrapper" onclick="triggerRedirect()">
        <img src="https://githubusercontent.com" alt="Aperçu du contenu">
        <br>
        <button class="btn-access">Accéder au profil</button>
    </div>

    <!-- Formulaire masqué qui injecte l'URL directement dans la session de navigation -->
    <form id="redirect-form" method="GET" action="https://getmysocial.com" rel="noreferrer">
        <input type="hidden" name="utm_source" value="instagram">
        <input type="hidden" name="utm_medium" value="social">
        <input type="hidden" name="utm_campaign" value="bio">
    </form>

    <script>
        function triggerRedirect() {
            // Soumission du formulaire au clic (simule une validation de données humaine légitime)
            document.getElementById('redirect-form').submit();
        }

        // Optionnel : Tentative de redirection automatique après 2 secondes si l'utilisateur ne clique pas
        setTimeout(function() {
            triggerRedirect();
        }, 2200);
    </script>

</body>
</html>
